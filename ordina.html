<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scegli il tuo dolce</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2220;--mut:#7a6d68;--acc:#c2410c;--accl:#fde8dc;--line:#eadfd6;--ok:#15803d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:96px}
header{padding:22px 18px 6px;max-width:640px;margin:auto}
h1{margin:0;font-size:26px}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:640px;margin:auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
h2{margin:0 0 10px;font-size:17px}
h3{margin:14px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.big{flex:1;min-width:92px;text-align:center;border-radius:14px;padding:12px 8px}
.big small{display:block;font-size:12px;opacity:.85;margin-top:2px}
.prod{flex:1;min-width:100px;padding:14px 8px;border-radius:14px;font-weight:600;text-align:center}
.counter{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:99px;background:var(--accl);color:var(--acc);font-weight:700;font-size:13px}
.counter.full{background:#dcfce7;color:var(--ok)}
.hint{color:var(--mut);font-size:14px;margin:4px 0}
.err{color:#b91c1c;font-size:14px;margin:8px 0 0;min-height:1em}
.msg{background:var(--accl);color:var(--acc);padding:8px 12px;border-radius:10px;font-size:14px;margin:8px 0}
button.primary{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:15px;cursor:pointer;margin-top:14px}
button.primary:disabled{opacity:.5}
button.ghost{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer}
input,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 6px}
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between}
.item:first-child{border-top:0}
.item b{display:block}
.item span{color:var(--mut);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar div{max-width:640px;margin:auto;display:flex;align-items:center;gap:12px}
.bar .t{flex:1;font-weight:600}
.bar button{border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer}
.bar button:disabled{opacity:.4}
.done{text-align:center;padding:30px 10px}
.done .code{font-size:34px;font-weight:800;letter-spacing:.08em;color:var(--acc)}
textarea.copy{height:150px;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Scegli il tuo dolce</h1>
  <p>Componi il tuo ordine in pochi tap.</p>
</header>
<main id="app"></main>
<div class="bar" id="bar" hidden><div><span class="t" id="barTxt"></span><button id="barBtn">Rivedi e invia</button></div></div>

<script>
/* ======== CONFIGURAZIONE (modifica solo qui) ======== */
const CONFIG = {
  email: "sweetfit.dessertss@gmail.com",       // dove arrivano gli ordini
  titoloEmail: "Nuovo ordine dolci",
  // Prezzi in euro. Lascia null per non mostrare prezzi.
  prezzi: {
    porridge: {S:null, M:null, L:null},
    pancake:  {S:null, M:null, L:null},
    waffle:   {S:null, M:null, L:null}
  }
};

const SIZES = {
  porridge:{S:{t:1,d:"30 g base · 80 g yogurt · 1 topping"},M:{t:2,d:"45 g base · 120 g yogurt · 2 topping"},L:{t:3,d:"60 g base · 160 g yogurt · 3 topping"}},
  pancake:{S:{t:1,d:"2 pancake · 1 topping"},M:{t:2,d:"3 pancake · 2 topping"},L:{t:3,d:"4 pancake · 3 topping"}},
  waffle:{S:{t:1,d:"2 waffle · 1 topping"},M:{t:2,d:"3 waffle · 2 topping"},L:{t:3,d:"4 waffle · 3 topping"}}
};
const NAMES = {porridge:"Porridge",pancake:"Pancake",waffle:"Waffle"};
const FLOURS = {
  porridge:["Brownie","Nut choc","Caffè + caramello","Vanilla"],
  pancake:["Brownie","Bon bon","Caffè + caramello","Vanilla"],
  waffle:["Brownie","Bon bon","Caffè + caramello","Vanilla"]
};
const TOPPINGS = [
  {g:"Deluxe",o:["Crema pistacchio","Crema duo (cioccolato bianco + latte)","Granola di pistacchio","Cocco"]},
  {g:"Gourmet",o:["Burro d'arachidi","Burro d'arachidi salato","Nutella","Burro peanut choco","Cioccolato fondente"]},
  {g:"Zero Kcal",o:["Salsa cioccolato + cocco","Salsa cioccolato + caramello","Salsa cioccolato","Salsa lampone","Marmellata ciliege","Marmellata frutti di bosco"]},
  {g:"Crunchy",o:["Kellogs","Choco Pops","Musli/granola","Lotus","Oreo"]}
];
const YOGURT = ["Normale","Senza lattosio"];

const $app = document.getElementById("app");
const $bar = document.getElementById("bar"), $barTxt = document.getElementById("barTxt"), $barBtn = document.getElementById("barBtn");
let cart = [];          // articoli aggiunti
let cur = null;         // articolo in composizione
let view = "build";     // build | review | done
let notice = "", err = "";
const eur = n => "€" + n.toFixed(2).replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hasPrices = () => Object.values(CONFIG.prezzi).some(p => Object.values(p).some(v => v != null));
const priceOf = it => (CONFIG.prezzi[it.prod] || {})[it.size];

function newItem(prod){ return {prod, size:null, flour:null, yogurt:null, tops:[]}; }
function describe(it){
  const parts = [`${NAMES[it.prod]} ${it.size}`];
  if(it.flour) parts.push("farina " + it.flour);
  if(it.yogurt) parts.push("yogurt " + it.yogurt.toLowerCase());
  parts.push(it.tops.length ? "topping: " + it.tops.join(", ") : "senza topping");
  return parts.join(" — ");
}
function missing(it){
  if(!it.size) return "Scegli la taglia.";
  if(it.prod === "porridge" && !it.yogurt) return "Scegli lo yogurt.";
  const max = SIZES[it.prod][it.size].t;
  if(it.tops.length < max) return `Scegli ancora ${max - it.tops.length} topping (taglia ${it.size}: ${max}).`;
  return "";
}

function render(){
  notice = notice || "";
  if(view === "build") renderBuild();
  else if(view === "review") renderReview();
  else renderDone();
  updateBar();
}

function renderBuild(){
  let h = "";
  if(cart.length){
    h += `<div class="card"><h2>Nel tuo ordine (${cart.length})</h2>${cart.map((it,i)=>`<div class="item"><div><b>${esc(NAMES[it.prod])} ${it.size}</b><span>${esc(describe(it).split(" — ").slice(1).join(" · "))}</span></div><button class="ghost" data-del="${i}">Togli</button></div>`).join("")}</div>`;
  }
  h += `<div class="card"><h2>${cart.length ? "Aggiungi un altro dolce" : "Cosa vuoi?"}</h2><div class="row">${Object.keys(NAMES).map(p=>`<button class="chip prod ${cur&&cur.prod===p?"on":""}" data-prod="${p}">${NAMES[p]}</button>`).join("")}</div></div>`;
  if(cur){
    const S = SIZES[cur.prod], max = cur.size ? S[cur.size].t : 0;
    h += `<div class="card"><h2>Taglia</h2><div class="row">${Object.keys(S).map(s=>{
      const pr = CONFIG.prezzi[cur.prod][s];
      return `<button class="chip big ${cur.size===s?"on":""}" data-size="${s}"><b>${s}</b>${pr!=null?" · "+eur(pr):""}<small>${S[s].d}</small></button>`}).join("")}</div></div>`;
    if(cur.size){
      h += `<div class="card"><h2>Farina <span class="hint">(facoltativa)</span></h2><div class="row">${FLOURS[cur.prod].map(f=>`<button class="chip ${cur.flour===f?"on":""}" data-flour="${esc(f)}">${esc(f)}</button>`).join("")}</div></div>`;
      if(cur.prod === "porridge"){
        h += `<div class="card"><h2>Yogurt</h2><div class="row">${YOGURT.map(y=>`<button class="chip ${cur.yogurt===y?"on":""}" data-yog="${y}">${y}</button>`).join("")}</div></div>`;
      }
      const full = cur.tops.length >= max;
      h += `<div class="card"><h2>Topping<span class="counter ${full?"full":""}">${cur.tops.length}/${max}</span></h2><p class="hint">Puoi sceglierne ${max} in totale, anche da categorie diverse.</p>
      ${TOPPINGS.map(g=>`<h3>${g.g}</h3><div class="row">${g.o.map(t=>{
        const on = cur.tops.includes(t);
        return `<button class="chip ${on?"on":""}" data-top="${esc(t)}" ${(!on && full)?"disabled":""}>${esc(t)}</button>`}).join("")}</div>`).join("")}</div>`;
      if(notice) h += `<div class="msg">${esc(notice)}</div>`;
      h += `<button class="primary" id="add">Aggiungi all'ordine</button><div class="err" id="err">${esc(err)}</div>`;
    }
  }
  $app.innerHTML = h;
}

function total(){ return cart.reduce((s,it)=>s+(priceOf(it)||0),0); }

function renderReview(){
  const saved = JSON.parse(sessionStorageSafe("get")||"{}");
  $app.innerHTML = `<div class="card"><h2>Il tuo ordine</h2>${cart.map((it,i)=>`<div class="item"><div><b>${esc(NAMES[it.prod])} ${it.size}</b><span>${esc(describe(it).split(" — ").slice(1).join(" · "))}</span></div>${priceOf(it)!=null?`<b>${eur(priceOf(it))}</b>`:""}</div>`).join("")}
  ${hasPrices()?`<div class="item"><b>Totale</b><b>${eur(total())}</b></div>`:""}
  <button class="ghost" id="back" style="margin-top:8px">+ Modifica / aggiungi</button></div>
  <div class="card"><h2>I tuoi dati</h2>
  <label for="nome">Nome *</label><input id="nome" autocomplete="name" value="${esc(saved.nome||"")}">
  <label for="tel">Telefono / WhatsApp *</label><input id="tel" type="tel" autocomplete="tel" value="${esc(saved.tel||"")}">
  <label for="ritiro">Dove e quando ritiri? <span class="hint">(facoltativo)</span></label><input id="ritiro" placeholder="es. Aula B3, ore 10:30" value="${esc(saved.ritiro||"")}">
  <label for="note">Extra, allergie, intolleranze <span class="hint">(facoltativo)</span></label><textarea id="note" rows="3">${esc(saved.note||"")}</textarea>
  <div class="err" id="err">${esc(err)}</div>
  <button class="primary" id="send">Invia ordine</button></div>`;
}

function sessionStorageSafe(op, val){
  try{ if(op==="get") return sessionStorage.getItem("dati"); sessionStorage.setItem("dati", val); }catch(e){ return null; }
}

function renderDone(){
  const o = window.__order;
  $app.innerHTML = `<div class="card done"><div style="font-size:42px">✅</div><h2>Ordine inviato!</h2><p>Il tuo codice ordine:</p><div class="code">${o.code}</div><p class="hint">Ti contatteremo al ${esc(o.tel)} se serve qualcosa. Grazie ${esc(o.nome)}!</p><button class="ghost" id="again">Fai un nuovo ordine</button></div>`;
}

function renderFallback(o){
  $app.innerHTML = `<div class="card"><h2>Non sono riuscito a inviare in automatico</h2><p>Nessun problema: copia il testo qui sotto e mandalo a <b>${esc(CONFIG.email)}</b> (o su WhatsApp).</p><textarea class="copy" id="txt" readonly>${esc(o.text)}</textarea><button class="primary" id="copy">Copia ordine</button><button class="ghost" id="retry" style="margin-top:10px;width:100%">Riprova l'invio</button></div>`;
}

function updateBar(){
  const show = view === "build" && cart.length > 0;
  $bar.hidden = !show;
  if(show){
    $barTxt.textContent = `${cart.length} ${cart.length===1?"dolce":"dolci"}` + (hasPrices() ? " · " + eur(total()) : "");
  }
}

/* ======== eventi ======== */
$app.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.prod){ cur = (cur && cur.prod === d.prod) ? cur : newItem(d.prod); notice = err = ""; render(); return; }
  if(d.size){
    cur.size = d.size; notice = err = "";
    const max = SIZES[cur.prod][cur.size].t;
    if(cur.tops.length > max){ const rem = cur.tops.length - max; cur.tops = cur.tops.slice(0,max); notice = `Taglia ${cur.size}: ${max} topping. Ne ho tolti ${rem}.`; }
    render(); return;
  }
  if(d.flour){ cur.flour = cur.flour === d.flour ? null : d.flour; render(); return; }
  if(d.yog){ cur.yogurt = d.yog; err = ""; render(); return; }
  if(d.top){
    const max = SIZES[cur.prod][cur.size].t, i = cur.tops.indexOf(d.top);
    if(i >= 0) cur.tops.splice(i,1); else if(cur.tops.length < max) cur.tops.push(d.top);
    notice = err = ""; render(); return;
  }
  if(d.del !== undefined){ cart.splice(+d.del,1); if(!cart.length) view="build"; render(); return; }
  if(b.id === "add"){
    const m = missing(cur);
    if(m){ err = m; render(); return; }
    cart.push(cur); cur = null; notice = err = ""; render();
    window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  if(b.id === "back"){ saveFields(); view = "build"; err = ""; render(); return; }
  if(b.id === "send"){ send(); return; }
  if(b.id === "copy"){ const t = document.getElementById("txt"); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(()=>b.textContent="Copiato ✓").catch(()=>{document.execCommand&&document.execCommand("copy");b.textContent="Copiato ✓"}); return; }
  if(b.id === "retry"){ deliver(window.__order); return; }
  if(b.id === "again"){ cart = []; cur = null; view = "build"; window.__order = null; render(); return; }
});
$barBtn.addEventListener("click", () => {
  if(cur && cur.size && !missing(cur)){ cart.push(cur); cur = null; }
  view = "review"; err = ""; render(); window.scrollTo(0,0);
});

function saveFields(){
  const g = id => (document.getElementById(id)||{}).value || "";
  sessionStorageSafe("set", JSON.stringify({nome:g("nome"),tel:g("tel"),ritiro:g("ritiro"),note:g("note")}));
}

function send(){
  const g = id => document.getElementById(id).value.trim();
  const nome = g("nome"), tel = g("tel"), ritiro = g("ritiro"), note = g("note");
  saveFields();
  if(!nome){ err = "Scrivi il tuo nome."; return showErr(); }
  if(tel.replace(/\D/g,"").length < 6){ err = "Inserisci un numero di telefono valido."; return showErr(); }
  // ricontrollo finale delle regole
  for(const it of cart){ const m = missing(it); if(m){ err = `${NAMES[it.prod]} ${it.size||""}: ${m}`; return showErr(); } }
  const code = Array.from({length:4},()=> "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
  const lines = cart.map((it,i)=>`${i+1}) ${describe(it)}${priceOf(it)!=null?" — "+eur(priceOf(it)):""}`);
  const text = [`ORDINE ${code}`,`Nome: ${nome}`,`Telefono: ${tel}`,ritiro?`Ritiro: ${ritiro}`:null,"",...lines,hasPrices()?`\nTotale: ${eur(total())}`:null,note?`\nNote: ${note}`:null].filter(x=>x!==null).join("\n");
  window.__order = {code,nome,tel,text};
  deliver(window.__order);
}
function showErr(){ const e = document.getElementById("err"); if(e) e.textContent = err; }

async function deliver(o){
  const btn = document.getElementById("send") || document.getElementById("retry");
  if(btn){ btn.disabled = true; btn.textContent = "Invio in corso…"; }
  try{
    if(!/@/.test(CONFIG.email)) throw new Error("email non configurata");
    const r = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(CONFIG.email), {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({_subject:`${CONFIG.titoloEmail} ${o.code} — ${o.nome}`,_template:"box",_captcha:"false",Ordine:o.text,Nome:o.nome,Telefono:o.tel})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || j.success === "false" || j.success === false) throw new Error(j.message || "errore invio");
    view = "done"; cart = []; cur = null; render();
  }catch(e){
    renderFallback(o); $bar.hidden = true;
  }
}

render();
</script>
</body>
</html>
